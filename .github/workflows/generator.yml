name: generator

on:
  push:
    paths:
      - 'Generator/**'
      - '.github/workflows/generator.yml'
  pull_request:
    paths:
      - 'Generator/**'
      - '.github/workflows/generator.yml'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Generator/package-lock.json
      - run: npm ci
      - run: npm run ci
      - run: npm run build
      - name: CLI smoke test
        shell: bash
        run: |
          node dist/cli/index.js --version
          set +e
          node dist/cli/index.js generate --suite x --registry y --out z --copyright-owner O --copyright-year 2026
          test $? -eq 2
